<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kota Naratama · Website Resmi</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6f9;--card:#fff;--tx:#14233a;--mut:#667791;--navy:#16304f;--steel:#41587a;--acc:#16304f;--green:#4f7d57;--green2:#7bb083;--line:#e1e7ef;--bad:#c94a4a;--ok:#2f9461;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1220;--card:#121d2f;--tx:#eaf0f8;--mut:#8fa0b8;--navy:#34609f;--steel:#5f8acb;--acc:#a7c4f2;--green:#6fae78;--green2:#9bd3a3;--line:#22324a}}
:root[data-theme="dark"]{--bg:#0a1220;--card:#121d2f;--tx:#eaf0f8;--mut:#8fa0b8;--navy:#34609f;--steel:#5f8acb;--acc:#a7c4f2;--green:#6fae78;--green2:#9bd3a3;--line:#22324a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{scroll-behavior:smooth;scroll-padding-top:80px}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.6 'Plus Jakarta Sans',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:hidden}
h1,h2,h3{font-family:'Fraunces',Georgia,serif;line-height:1.2;margin:0}a{color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:0 18px}
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--card) 90%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.hd{display:flex;align-items:center;gap:12px;height:64px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;cursor:pointer}.brand b{font:700 17px 'Fraunces',serif;letter-spacing:1px;color:var(--acc);display:block;line-height:1.1}.brand small{font-size:9px;letter-spacing:3px;color:var(--mut);font-weight:700}
.lg{display:inline-grid;place-items:center;background:#fff;border-radius:12px;width:42px;height:42px;box-shadow:0 2px 8px #0002;flex:none}.lg img{width:28px;height:auto;display:block}
.sp{flex:1}
nav.dk{display:none;gap:2px;align-items:center}
nav.dk a,nav.dk .gt{padding:8px 11px;border-radius:10px;font-weight:700;font-size:13px;color:var(--mut);cursor:pointer;text-decoration:none;position:relative;transition:.2s}
nav.dk a:hover,nav.dk .g:hover .gt{color:var(--tx);background:var(--bg)}nav.dk a.on,nav.dk .gt.on{color:var(--acc);background:#41587a1c}
.g{position:relative}.dd{display:none;position:absolute;top:100%;left:0;min-width:210px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px;box-shadow:0 16px 36px #0003}
.g:hover .dd{display:block}.dd a{display:block}
.bt{border:0;background:var(--bg);color:var(--tx);width:42px;height:42px;border-radius:12px;cursor:pointer;display:grid;place-items:center}
#dr{position:fixed;inset:0;z-index:30;background:#0008;display:none}#dr.on{display:block}
#dr>div{position:absolute;right:0;top:0;bottom:0;width:min(320px,86vw);background:var(--card);padding:18px;overflow:auto;animation:sl .3s ease}
@keyframes sl{from{transform:translateX(40px);opacity:0}}
#dr h4{margin:16px 0 6px;font-size:11px;letter-spacing:2px;color:var(--mut);text-transform:uppercase}#dr a{display:block;padding:11px 12px;border-radius:12px;font-weight:700;text-decoration:none;cursor:pointer}#dr a.on{background:#41587a1c;color:var(--acc)}
@media(min-width:900px){nav.dk{display:flex}.bt.mb{display:none}}
main{min-height:70vh;animation:fade .4s ease}@keyframes fade{from{opacity:0;transform:translateY(10px)}}
.hero{position:relative;overflow:hidden;color:#fff;background:linear-gradient(135deg,#0f2742,#1f4470 55%,#2a6b68);padding:56px 0 110px}
.hero h1{font-size:clamp(30px,6vw,52px);max-width:640px}.hero p{max-width:540px;opacity:.88;margin:14px 0 24px;font-size:16px}
.hero .sky{position:absolute;left:0;right:0;bottom:0;width:100%;height:100px}
.btn{display:inline-block;border:0;border-radius:12px;padding:12px 20px;font:inherit;font-weight:800;font-size:14px;cursor:pointer;text-decoration:none;background:var(--navy);color:#fff;transition:transform .15s}
.btn:active{transform:scale(.96)}.btn.g{background:linear-gradient(135deg,var(--green),var(--green2))}.btn.w{background:#fff;color:#16304f}.btn.o{background:transparent;border:2px solid var(--line);color:var(--tx)}.btn.s{padding:8px 14px;font-size:13px}
.hero .btn.o{border-color:#ffffff66;color:#fff}.cta{display:flex;gap:10px;flex-wrap:wrap}
section{padding:36px 0}.sh{margin-bottom:20px}.sh h2{font-size:26px}.sh p{color:var(--mut);margin:6px 0 0}
.pg{padding:30px 0 20px}.pg h1{font-size:clamp(26px,5vw,38px)}.pg>.wrap>p{color:var(--mut);max-width:620px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 8px 24px #16304f10;animation:fade .4s both}
.card h3{font-size:18px;margin-bottom:6px}.card p{margin:0;color:var(--mut);font-size:14px}
.ib{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,var(--green),var(--green2));color:#fff;margin-bottom:12px}
.stats{margin-top:-60px;position:relative;z-index:2;display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.stats .card{text-align:center;padding:16px}.stats b{display:block;font:700 30px 'Fraunces',serif;color:var(--acc)}.stats span{font-size:12px;color:var(--mut);font-weight:700}
.chip{display:inline-block;font-size:11px;font-weight:800;padding:3px 10px;border-radius:20px;background:#41587a1c;color:var(--acc)}.chip.ok{background:#2f946120;color:var(--ok)}.chip.no{background:#c94a4a20;color:var(--bad)}
.av{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font:700 22px 'Fraunces',serif;color:#fff;background:linear-gradient(135deg,var(--navy),var(--steel));margin-bottom:10px}
.tl{border-left:3px solid var(--line);padding-left:18px;margin-left:6px}.tl div{position:relative;margin-bottom:18px}.tl div:before{content:"";position:absolute;left:-26px;top:5px;width:11px;height:11px;border-radius:50%;background:var(--green)}
.tl b{display:block}.mut{color:var(--mut)}
.row{display:flex;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}
.db{width:56px;text-align:center;border-radius:14px;background:linear-gradient(135deg,var(--navy),var(--steel));color:#fff;padding:6px 0;flex:none}.db b{display:block;font:700 22px 'Fraunces',serif;line-height:1}.db small{font-size:10px;letter-spacing:1px}
input{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--tx);font:inherit;font-size:16px;outline:none}input:focus{border-color:var(--green)}
label{display:block;font-size:12px;font-weight:700;color:var(--mut);margin:12px 0 5px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.tabs span{padding:8px 14px;border-radius:20px;border:1.5px solid var(--line);font-weight:700;font-size:13px;cursor:pointer;color:var(--mut)}.tabs .on{background:var(--navy);border-color:var(--navy);color:#fff}
.gal{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}.gal div{aspect-ratio:4/3;border-radius:16px;background:linear-gradient(135deg,#41587a33,#4f7d5733);display:grid;place-items:center;text-align:center;padding:10px;font-size:12px;color:var(--mut);font-weight:700;background-size:cover;background-position:center;cursor:pointer;overflow:hidden}
#md{position:fixed;inset:0;background:#000a;backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:40;padding:16px}#md.on{display:flex}
#md>div{background:var(--card);border-radius:22px;padding:22px;width:100%;max-width:520px;max-height:88vh;overflow:auto;animation:fade .3s}
.idc{--navy:#fff;position:relative;aspect-ratio:1.586;border-radius:20px;padding:18px;color:#fff;background:linear-gradient(135deg,#0d2340,#1d4272 58%,#2a6b68);box-shadow:0 22px 44px #0a1a3066;overflow:hidden}
.idc:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 88% 8%,#ffffff2b,transparent 45%),repeating-linear-gradient(115deg,#ffffff0a 0 2px,transparent 2px 11px)}
.idc .h{display:flex;align-items:center;gap:10px;position:relative}.idc .lg{width:34px;height:34px;border-radius:10px}.idc .lg img{width:22px}.idc .t1{font-size:8px;letter-spacing:2.5px;opacity:.75}.idc .t2{font:700 15px 'Fraunces',serif;letter-spacing:1px}
.idc .chp{margin-left:auto;width:34px;height:26px;border-radius:6px;background:linear-gradient(135deg,#f0cd72,#b98a2e)}
.idc .bd{display:flex;gap:14px;margin-top:14px;position:relative}.idc .pic{width:62px;height:76px;border-radius:12px;background:#ffffff1f;border:1px solid #ffffff44;display:grid;place-items:center;font:700 28px 'Fraunces',serif;flex:none}
.idc dt{font-size:8px;letter-spacing:2px;opacity:.65}.idc dd{margin:0 0 6px;font-weight:700;font-size:15px}.idc dl{margin:0;min-width:0}
.idc .ft{position:absolute;left:18px;right:18px;bottom:13px;font-size:10px;letter-spacing:2.5px;opacity:.85}
.hint{font-size:13px;font-weight:700;margin-top:10px}.hint.bad{color:var(--bad)}
footer{margin-top:40px;background:#0f2742;color:#cfdcf0;padding:34px 0 26px;font-size:13px}footer .wrap{display:grid;gap:22px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
footer h4{margin:0 0 8px;color:#fff;font-size:12px;letter-spacing:2px;text-transform:uppercase}footer a{display:block;color:#cfdcf0;text-decoration:none;padding:3px 0;cursor:pointer}
textarea{width:100%;min-height:90px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--tx);font:inherit;font-size:16px;outline:none;resize:vertical}textarea:focus{border-color:var(--green)}.soon{opacity:.7}.empty{padding:26px;text-align:center;color:var(--mut)}
</style></head><body>

const nl=a=>a.slice().sort((x,y)=>y.tgl.localeCompare(x.tgl));
const today=()=>new Date().toISOString().slice(0,10);
const PAGES={
 beranda(){const up=D.agenda.filter(a=>a.tgl>=today()).sort((a,b)=>a.tgl.localeCompare(b.tgl)).slice(0,3),nw=nl(D.berita).slice(0,3);
  return `<div class="hero"><div class="wrap"><h1>Selamat datang di Kota Naratama</h1><p>Kota roleplay yang tertib, ramah, dan berkembang. Daftarkan karakter, kenali pemerintahan, dan ikuti kegiatan kota.</p><div class="cta"><a class="btn w" href="${esc(D.links.daftarIC)}" target="_blank" rel="noopener">Daftar IC</a><a class="btn o" href="#/profil">Kenali Kota</a></div></div>${SKY}</div>
  <div class="wrap"><div class="stats"><div class="card"><b id="s_t">…</b><span>Warga Terdaftar</span></div><div class="card"><b>${D.instansi.length}</b><span>Instansi</span></div><div class="card"><b>${D.agenda.filter(a=>a.tgl>=today()).length}</b><span>Agenda Mendatang</span></div></div></div>
  <section><div class="wrap"><div class="sh"><h2>Layanan Publik</h2><p>Akses layanan kota dengan cepat.</p></div><div class="grid">${D.layanan.slice(0,3).map(svc).join('')}</div></div></section>
  <section><div class="wrap"><div class="sh"><h2>Berita Terbaru</h2></div><div class="grid">${nw.map(newsCard).join('')}</div></div></section>
  <section><div class="wrap"><div class="sh"><h2>Agenda Mendatang</h2></div><div class="card">${up.length?up.map(agRow).join(''):'<div class="empty">Belum ada agenda mendatang.</div>'}</div></div></section>`},
 profil(){const p=D.profil;return sec('Profil Kota',esc(p.desk),`<div class="grid">${p.fakta.map(f=>`<div class="card"><p>${esc(f[0])}</p><h3>${esc(f[1])}</h3></div>`).join('')}</div>
  <div class="grid" style="margin-top:14px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))"><div class="card"><h3>Visi</h3><p style="margin-top:8px">${esc(p.visi)}</p></div><div class="card"><h3>Misi</h3><ul style="margin:8px 0 0;padding-left:18px;color:var(--mut)">${p.misi.map(m=>`<li>${esc(m)}</li>`).join('')}</ul></div></div>
  <div class="sh" style="margin-top:30px"><h2>Sejarah</h2></div><div class="tl">${p.sejarah.map(s=>`<div><b>${esc(s.t)}</b><span class="mut">${esc(s.d)}</span></div>`).join('')}</div>`)},
 pemerintahan(){return sec('Pemerintahan','Struktur pejabat pemerintahan Kota Naratama.',`<div class="grid">${D.pemerintahan.map(x=>`<div class="card"><div class="av">${esc((x.n||x.j)[0].toUpperCase())}</div><p>${esc(x.j)}</p><h3>${x.n?esc(x.n):'<span class="mut">Belum diisi</span>'}</h3></div>`).join('')}</div>`)},
 instansi(){return sec('Instansi','Lembaga yang melayani warga Kota Naratama.',`<div class="grid">${D.instansi.map(x=>`<div class="card"><span class="chip">${esc(x.s)}</span><h3 style="margin-top:10px">${esc(x.n)}</h3><p>${esc(x.t)}</p><div style="margin-top:12px">${x.r?'<a class="btn s g" href="#/rekrutmen">Rekrutmen dibuka</a>':'<span class="chip no">Rekrutmen ditutup</span>'}</div></div>`).join('')}</div>`)},
 warga(){return sec('Data Warga','Daftar warga yang sudah terdaftar. Hanya menampilkan data IC.',`<div class="card"><div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center"><div style="flex:1;min-width:200px"><input id="wq" placeholder="Cari nama IC atau nomor registrasi" oninput="wsearch()"></div><span class="chip" id="wt">…</span></div><div id="wl" style="margin-top:8px"><div class="empty">Memuat data…</div></div></div><p style="margin-top:14px"><a class="btn g" href="${esc(D.links.daftarIC)}" target="_blank" rel="noopener">Daftarkan IC-mu</a></p>`)},
 layanan(){return sec('Layanan Publik','Layanan yang tersedia untuk warga Naratama.',`<div class="grid">${D.layanan.map(svc).join('')}</div>`)},
 rekrutmen(){return sec('Rekrutmen','Bergabunglah menjadi bagian dari instansi Kota Naratama.',`<div class="grid">${D.rekrut.map(r=>`<div class="card"><span class="chip">${esc(r.i)}</span> <span class="chip ${r.o?'ok':'no'}">${r.o?'Dibuka':'Ditutup'}</span><h3 style="margin-top:10px">${esc(r.p)}</h3><p>${esc(r.u)}</p><b style="display:block;margin:12px 0 4px;font-size:13px">Persyaratan</b><ul style="margin:0;padding-left:18px;color:var(--mut);font-size:14px">${r.s.map(s=>`<li>${esc(s)}</li>`).join('')}</ul>${r.o&&D.links.discord?`<p style="margin-top:14px"><a class="btn g s" href="${esc(D.links.discord)}" target="_blank" rel="noopener">Daftar</a></p>`:r.o?'<p style="margin-top:14px" class="chip">Info pendaftaran segera hadir</p>':''}</div>`).join('')}</div>`)},
 dokumen(){const ks=['Semua',...new Set(D.dokumen.map(d=>d.k))],k=S.dk||'Semua';
  return sec('Peraturan & Dokumen','Peraturan dan dokumen resmi Kota Naratama.',`<div class="tabs">${ks.map(x=>`<span class="${x===k?'on':''}" onclick="S.dk='${esc(x)}';render()">${esc(x)}</span>`).join('')}</div><div class="card">${D.dokumen.filter(d=>k==='Semua'||d.k===k).map(d=>`<div class="row"><div class="ib" style="margin:0">${ic('doc',22)}</div><div style="flex:1"><b>${esc(d.j)}</b><div class="mut" style="font-size:13px">${esc(d.k)} · ${esc(d.tgl)}</div></div>${safeUrl(d.url)?`<a class="btn s" href="${esc(safeUrl(d.url))}" target="_blank" rel="noopener">Buka</a>`:'<span class="chip soon">Segera diunggah</span>'}</div>`).join('')||'<div class="empty">Belum ada dokumen.</div>'}</div>`)},
 agenda(){const t=today(),a=D.agenda.slice().sort((x,y)=>x.tgl.localeCompare(y.tgl)),up=a.filter(x=>x.tgl>=t),pa=a.filter(x=>x.tgl<t).reverse();
  return sec('Agenda Kota','Kegiatan dan acara resmi Kota Naratama.',`<div class="card"><h3 style="margin-bottom:6px">Mendatang</h3>${up.length?up.map(agRow).join(''):'<div class="empty">Belum ada agenda mendatang.</div>'}</div>${pa.length?`<div class="card"><h3 style="margin-bottom:6px">Sudah Lewat</h3>${pa.map(agRow).join('')}</div>`:''}`)},
 berita(){return sec('Berita','Kabar terbaru dari Kota Naratama.',`<div class="grid">${nl(D.berita).map(newsCard).join('')||'<div class="empty">Belum ada berita.</div>'}</div>`)},
 galeri(){return sec('Galeri','Dokumentasi kegiatan dan sudut kota.',`<div class="gal">${D.galeri.map((g,i)=>`<div style="${safeImg(g.th)?`background-image:url('${safeImg(g.th)}')`:''}" onclick="showG(${i})">${safeImg(g.th)?'':esc(g.j)+'<br><small>Foto segera hadir</small>'}</div>`).join('')}</div>`)},
 admin(){if(!S.at)return sec('Admin','Khusus pengelola website.',`<div class="card" style="max-width:380px"><label>PIN admin</label><input id="ap" type="password" inputmode="numeric" maxlength="6"><p style="margin:14px 0 0"><button class="btn" style="width:100%" onclick="alogin()">Masuk</button></p><div id="ae" class="hint bad"></div></div>`);
  const k=S.ak||'berita',its=(S.rows||[]).filter(r=>r.kind===k);
  return sec('Panel Admin','Kelola isi website kota. Perubahan langsung tampil di website.',`<div class="tabs">${Object.keys(SCH).map(x=>`<span class="${x===k?'on':''}" onclick="S.ak='${x}';render()">${LBL[x]}</span>`).join('')}</div><div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><h3>${LBL[k]} (${its.length})</h3><button class="btn g s" onclick="aform('${k}')">+ Tambah</button></div>${its.map(r=>{const[a,b]=ttl(k,r.data);return `<div class="row"><div style="flex:1;min-width:0"><b>${esc(a)}</b><div class="mut" style="font-size:13px">${esc(b||'')}</div></div><div style="display:flex;gap:6px"><button class="btn o s" onclick="aform('${k}',${r.id})">Ubah</button><button class="btn o s" onclick="adel(${r.id})">Hapus</button></div></div>`}).join('')||'<div class="empty">Belum ada data. Website menampilkan contoh bawaan sampai kamu menambah data di sini.</div>'}</div><p><button class="btn o s" onclick="alogout()">Keluar dari admin</button></p>`)},
 portal(){const w=S.w;
  if(w)return sec('Portal Warga','Selamat datang, '+esc(w.ic)+'.',`<div style="max-width:420px">${kcard(w)}<p style="margin-top:16px"><button class="btn o" onclick="wlogout()">Keluar</button></p></div>`);
  return sec('Portal Warga','Masuk dengan username Roblox dan nama IC yang kamu daftarkan untuk melihat KTP-mu.',`<div class="card" style="max-width:420px"><label>Username Roblox</label><input id="pu" autocapitalize="none" maxlength="20"><label>Nama IC</label><input id="pi" maxlength="30"><p style="margin:14px 0 0"><button class="btn" onclick="wlogin()" style="width:100%">Masuk</button></p><div id="pe" class="hint bad"></div></div><p class="mut" style="margin-top:14px">Belum punya IC? <a href="${esc(D.links.daftarIC)}" target="_blank" rel="noopener" style="color:var(--acc);font-weight:700">Daftar di sini</a>.</p>`)}
};
function svc(s){const h=s.href&&!s.soon?`href="${s.href.replace('%DAFTAR%',esc(D.links.daftarIC))}" ${s.href.startsWith('%')||s.href.startsWith('http')?'target="_blank" rel="noopener"':''}`:'';
 return `<${h?'a':'div'} class="card ${s.soon?'soon':''}" ${h} style="text-decoration:none;display:block"><div class="ib">${ic(s.ic)}</div><h3>${esc(s.j)}</h3><p>${esc(s.d)}</p>${s.soon?'<p style="margin-top:10px"><span class="chip">Segera hadir</span></p>':''}</${h?'a':'div'}>`}
function agRow(a){const d=new Date(a.tgl+'T00:00:00');return `<div class="row"><div class="db"><b>${d.getDate()}</b><small>${d.toLocaleDateString('id-ID',{month:'short'}).toUpperCase()}</small></div><div><b>${esc(a.j)}</b><div class="mut" style="font-size:13px">${esc(a.l)}</div><div style="font-size:14px;color:var(--mut)">${esc(a.d)}</div></div></div>`}
function newsCard(n){const i=D.berita.indexOf(n);return `<div class="card" style="cursor:pointer" onclick="showN(${i})"><span class="chip">${fdate(n.tgl)}</span><h3 style="margin:10px 0 6px">${esc(n.j)}</h3><p>${esc(n.r)}</p></div>`}
function showN(i){const n=D.berita[i];modal(`<span class="chip">${fdate(n.tgl)}</span><h2 style="margin:10px 0">${esc(n.j)}</h2><p style="color:var(--mut)">${esc(n.x)}</p><p><button class="btn o s" onclick="closeM()">Tutup</button></p>`)}
const D0=structuredClone(D);
const safeUrl=u=>/^https?:\/\//i.test(u||'')?u:'';
const safeImg=u=>/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+\/=]+$/.test(u||'')?u:'';
function showG(i){const g=D.galeri[i];if(!g)return;
 if(g._id){modal(`<h3>${esc(g.j)}</h3><p class="mut" id="gi">Memuat foto…</p><p><button class="btn o s" onclick="closeM()">Tutup</button></p>`);
  rpc('cms_get',{p_id:g._id}).then(r=>{const u=safeImg(r.img),e=$('#gi');if(e)e.outerHTML=u?`<img src="${u}" style="width:100%;border-radius:14px;margin-top:10px" alt="${esc(g.j)}">`:'<p class="mut">Foto tidak tersedia.</p>'}).catch(()=>{const e=$('#gi');if(e)e.textContent='Foto gagal dimuat.'});return}
 modal(`<h3>${esc(g.j)}</h3><p class="mut">Foto segera hadir.</p><p><button class="btn o s" onclick="closeM()">Tutup</button></p>`)}
function applyCms(rows){const by=k=>rows.filter(r=>r.kind===k).map(r=>({...r.data,_id:r.id})),pick=(k,fb)=>{const a=by(k);return a.length?a:fb};
 D.berita=pick('berita',D0.berita);D.agenda=pick('agenda',D0.agenda);D.dokumen=pick('dokumen',D0.dokumen);
 D.instansi=pick('instansi',D0.instansi);D.rekrut=pick('rekrut',D0.rekrut);
 const pj=by('pejabat').sort((a,b)=>(a.o||0)-(b.o||0)||a._id-b._id);D.pemerintahan=pj.length?pj:D0.pemerintahan;
 const gl=by('galeri').reverse();D.galeri=gl.length?gl:D0.galeri}
async function loadCms(){try{const j=await rpc('cms_list');S.rows=Array.isArray(j)?j:[];applyCms(S.rows);render()}catch(e){}}
async function call(fn,a){const j=await rpc(fn,a);if(j&&j.error){if(j.expired){S.at=null;render()}throw new Error(j.error)}return j}
const LBL={berita:'Berita',agenda:'Agenda',dokumen:'Dokumen',pejabat:'Pemerintahan',instansi:'Instansi',rekrut:'Rekrutmen',galeri:'Galeri'};
const SCH={berita:[['tgl','Tanggal','date'],['j','Judul'],['r','Ringkasan'],['x','Isi berita','area']],
 agenda:[['tgl','Tanggal','date'],['j','Nama acara'],['l','Lokasi'],['d','Deskripsi','area']],
 dokumen:[['j','Judul'],['k','Kategori (mis. Peraturan)'],['tgl','Tanggal (teks bebas)'],['url','Link dokumen (opsional, diawali https://)']],
 pejabat:[['j','Jabatan'],['n','Nama pejabat'],['o','Urutan tampil (angka kecil = lebih atas)','number']],
 instansi:[['n','Nama instansi'],['s','Singkatan'],['t','Tugas','area'],['r','Rekrutmen sedang dibuka','check']],
 rekrut:[['p','Posisi'],['i','Singkatan instansi'],['u','Deskripsi','area'],['s','Persyaratan (satu per baris)','area'],['o','Sedang dibuka','check']],
 galeri:[['j','Judul foto'],['foto','Foto','file']]};
const ttl=(k,d)=>({berita:[d.j,d.tgl],agenda:[d.j,d.tgl],dokumen:[d.j,d.k],pejabat:[d.j,d.n||'Belum diisi'],instansi:[d.n,d.s],rekrut:[d.p,d.i],galeri:[d.j,'Foto']}[k]);
function fld(f,v){const[k,l,t]=f,id='f_'+k;
 if(t==='area')return `<label>${l}</label><textarea id="${id}">${esc(v??'')}</textarea>`;
 if(t==='check')return `<label style="display:flex;gap:8px;align-items:center;margin-top:14px"><input id="${id}" type="checkbox" style="width:auto" ${v?'checked':''}> ${l}</label>`;
 if(t==='file')return `<label>${l}</label><input id="${id}" type="file" accept="image/*">`;
 return `<label>${l}</label><input id="${id}" type="${t||'text'}" value="${esc(v??'')}">`}
function aform(k,id){const row=id?(S.rows||[]).find(r=>r.id===id):null,d=row?{...row.data}:{};if(k==='rekrut'&&Array.isArray(d.s))d.s=d.s.join('\n');
 modal(`<h3>${id?'Ubah':'Tambah'} ${LBL[k]}</h3>${SCH[k].map(f=>fld(f,d[f[0]])).join('')}<p style="margin-top:16px;display:flex;gap:8px"><button class="btn g" onclick="asave('${k}',${id||'null'})">Simpan</button><button class="btn o" onclick="closeM()">Batal</button></p>`)}
function rs(file,max,q){return new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const s=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*s);c.height=Math.round(i.height*s);c.getContext('2d').drawImage(i,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',q))};i.onerror=()=>no(new Error('File bukan gambar'));i.src=r.result};r.onerror=()=>no(new Error('Gagal membaca file'));r.readAsDataURL(file)})}
async function asave(k,id){const d={};
 for(const[key,l,t]of SCH[k]){const e=$('#f_'+key);
  if(t==='check')d[key]=e.checked;else if(t==='number')d[key]=Number(e.value)||0;
  else if(t==='file'){const f=e.files[0];if(f){try{d.img=await rs(f,900,.72);d.th=await rs(f,320,.7)}catch(x){return alert(x.message)}}else if(!id)return alert('Pilih foto dulu')}
  else d[key]=e.value.trim()}
 if(k==='rekrut')d.s=(d.s||'').split('\n').map(x=>x.trim()).filter(Boolean);
 if(!d[SCH[k][0][0]])return alert('Kolom "'+SCH[k][0][1]+'" wajib diisi');
 if(k==='galeri'&&!d.j)return alert('Judul wajib diisi');
 if(d.url&&!safeUrl(d.url))return alert('Link harus diawali https://');
 try{await call('cms_save',{p_token:S.at,p_kind:k,p_id:id,p_data:d});closeM();await loadCms();alert('Tersimpan')}catch(e){alert(e.message)}}
function adel(id){modal(`<h3>Hapus data ini?</h3><p class="mut">Tindakan ini tidak bisa dibatalkan.</p><p style="display:flex;gap:8px"><button class="btn" style="background:var(--bad)" onclick="adoDel(${id})">Ya, Hapus</button><button class="btn o" onclick="closeM()">Batal</button></p>`)}
async function adoDel(id){closeM();try{await call('cms_delete',{p_token:S.at,p_id:id});await loadCms()}catch(e){alert(e.message)}}
async function alogin(){const e=$('#ae');e.textContent='';try{const j=await rpc('admin_login',{p_pin:$('#ap').value});if(j.error){e.textContent=j.error;return}S.at=j.token;render()}catch(x){e.textContent='Tidak bisa terhubung ke server.'}}
function alogout(){S.at=null;render()}
function kcard(c){return `<div class="idc"><div class="h"><span class="lg"><img src="${IMG_ICON}" alt=""></span><div><div class="t1">KARTU TANDA PENDUDUK</div><div class="t2">KOTA NARATAMA</div></div><div class="chp"></div></div><div class="bd"><div class="pic">${esc(c.ic[0].toUpperCase())}</div><dl><dt>NAMA IC</dt><dd>${esc(c.ic)}</dd><dt>UMUR</dt><dd>${esc(c.iage)} tahun</dd><dt>USERNAME</dt><dd>@${esc(c.user)}</dd></dl></div><div class="ft">${esc(c.no)} · RESMI</div></div>`}
const S={dk:'Semua',w:null};let wt;
async function wlogin(){const u=$('#pu').value.trim(),i=$('#pi').value.trim().replace(/\s+/g,' '),e=$('#pe');e.textContent='';
 if(!u||!i){e.textContent='Isi username dan nama IC.';return}
 try{const j=await rpc('reg_ktp',{p_user:u,p_ic:i});if(j.error){e.textContent=j.error;return}
  if(!j.exists){e.textContent='Username ini belum terdaftar.';return}if(!j.card){e.textContent='Nama IC tidak cocok dengan username ini.';return}
  S.w=j.card;render()}catch(x){e.textContent='Tidak bisa terhubung ke server.'}}
function wlogout(){S.w=null;render()}
function wsearch(){clearTimeout(wt);wt=setTimeout(wload,300)}
async function wload(){const q=($('#wq')||{}).value||'',l=$('#wl');if(!l)return;
 try{const j=await rpc('warga_list',{p_q:q.trim(),p_limit:60});if(j.error)throw 0;
  $('#wt').textContent=(q.trim()?j.rows.length+' hasil':'Total '+j.total+' warga');
  l.innerHTML=j.rows.length?j.rows.map(r=>`<div class="row"><div class="av" style="margin:0;width:44px;height:44px;font-size:17px">${esc(r.ic[0].toUpperCase())}</div><div style="flex:1"><b>${esc(r.ic)}</b><div class="mut" style="font-size:13px">IC ${r.iage} tahun</div></div><span class="chip">${esc(r.no)}</span></div>`).join(''):'<div class="empty">Tidak ditemukan.</div>'}catch(e){if(l)l.innerHTML='<div class="empty">Data belum bisa dimuat.</div>'}}
async function fill(c){if(c==='warga')wload();if(c==='beranda'){try{const j=await rpc('warga_stats');const e=$('#s_t');if(e)e.textContent=j.total}catch(e){const x=$('#s_t');if(x)x.textContent='—'}}}
function render(){const c=cur(),p=PAGES[c]||PAGES.beranda;$('#app').innerHTML=p();buildNav();fill(PAGES[c]?c:'beranda')}
addEventListener('hashchange',()=>{render();scrollTo(0,0)});
document.querySelector('.bt.mb').innerHTML=ic('menu',22);
render();loadCms();
</script></body></html>
